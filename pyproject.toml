[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-architecture-lab"
version = "0.1.0"
description = "Reproducible single-agent coding experiments with usage accounting"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
token-counting = ["tokenizers==0.22.2", "Jinja2==3.1.6"]

[project.scripts]
agent-lab = "agent_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
